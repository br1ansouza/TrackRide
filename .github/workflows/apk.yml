name: APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

concurrency:
  group: apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build standalone bundle
        env:
          VITE_STANDALONE: '1'
          VITE_API_URL: ${{ vars.API_URL || 'https://trackride-api.onrender.com' }}
          VITE_PROXY_URL: ${{ vars.PROXY_URL || 'https://trackride.br1ansouza.workers.dev' }}
        run: npx vite build

      - name: Sync Capacitor
        run: |
          cp capacitor.config.example.ts capacitor.config.ts
          npx cap sync android
          find android/app/src/main/assets/public -name '*.gz' -delete || true

      - name: Assemble APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TrackRide.apk
          notes="Build automatico de \`${GITHUB_SHA::7}\` em $(date -u '+%d/%m/%Y %H:%M UTC').

          APK de debug: para instalar por cima de uma versao anterior instalada com outra chave, desinstale antes.

          $(git log -1 --pretty=%s)"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --notes "$notes"
            gh release upload apk-latest TrackRide.apk --clobber
          else
            gh release create apk-latest TrackRide.apk \
              --title "APK mais recente" \
              --notes "$notes"
          fi

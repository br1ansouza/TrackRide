version: 2
updates:
  - package-ecosystem: bundler
    directory: "/backend"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    rebase-strategy: auto
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    rebase-strategy: auto
    open-pull-requests-limit: 5
    groups:
      capacitor:
        applies-to: version-updates
        patterns:
          - "@capacitor*"
      sveltekit:
        applies-to: version-updates
        patterns:
          - "@sveltejs/kit"
          - "@sveltejs/adapter-*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: auto
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

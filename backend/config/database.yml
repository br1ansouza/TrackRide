default: &default
  adapter: postgis
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER", "trackride") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

development:
  <<: *default
  database: trackride_development

test:
  <<: *default
  database: trackride_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "trackride_production") %>
  url: <%= ENV["DATABASE_URL"] %>
